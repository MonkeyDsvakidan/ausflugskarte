<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ausflugskarte Schweiz</title>
<meta name="description" content="Wanderungen und Ausflüge in der Schweiz, gefiltert nach freier Zeit, Anreise und Wetter.">
<meta name="theme-color" content="#242a34">
<link rel="canonical" href="https://monkeydsvakidan.github.io/ausflugskarte/">
<meta property="og:type" content="website">
<meta property="og:title" content="Ausflugskarte Schweiz">
<meta property="og:description" content="Wanderungen und Ausflüge, gefiltert nach freier Zeit, Anreise und Wetter.">
<meta property="og:image" content="https://monkeydsvakidan.github.io/ausflugskarte/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://monkeydsvakidan.github.io/ausflugskarte/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ausflüge">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,600..800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css?v=15">
</head>
<body>
<div id="map" role="region" aria-label="Karte der Ausflüge"></div>
<div class="map-error" id="map-error" hidden></div>

<!-- Kartensteuerung -->
<div class="ctrl" id="ctrl">
  <div class="ctrl-group">
    <button type="button" id="z-in" aria-label="Hineinzoomen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button type="button" id="z-out" aria-label="Herauszoomen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
    <button type="button" id="kompass" aria-label="Karte nach Norden ausrichten"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 16 12h-8z" fill="var(--berg)"/><path d="M12 22 8 12h8z" fill="currentColor" opacity=".5"/></svg></button>
  </div>
  <div class="ctrl-group">
    <button type="button" id="drei" aria-pressed="false" aria-label="3D-Ansicht"><span class="txt">3D</span></button>
    <button type="button" id="ebenen-btn" aria-expanded="false" aria-controls="ebenen" aria-label="Kartenstil wählen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg></button>
  </div>
  <div class="layers" id="ebenen" hidden>
    <h3>Karte</h3>
    <div class="basen" id="basen">
      <button type="button" class="basis b-auto" data-v="auto"><i></i>Automatisch</button>
      <button type="button" class="basis b-hell" data-v="hell"><i></i>Hell</button>
      <button type="button" class="basis b-karte" data-v="karte"><i></i>Landeskarte</button>
      <button type="button" class="basis b-luftbild" data-v="luftbild"><i></i>Luftbild</button>
      <button type="button" class="basis b-nacht" data-v="nacht"><i></i>Nacht</button>
    </div>
    <label class="switch"><span>Wanderwege<small>ab Regionen-Zoom</small></span><input type="checkbox" id="sw-wege"></label>
    <label class="switch"><span>3D-Gelände<small>Karte kippen mit zwei Fingern</small></span><input type="checkbox" id="sw-drei"></label>
  </div>
</div>

<!-- Panel / Bottom-Sheet -->
<aside class="panel" id="panel" aria-label="Ausflüge">
  <button type="button" class="grab" id="grab" aria-label="Liste grösser oder kleiner ziehen"></button>
  <div class="scroll" id="scroll">

    <!-- Liste -->
    <section class="view" id="view-liste">
      <header class="head contour pad drag">
        <div class="head-top">
          <svg class="logo" viewBox="0 0 36 36" aria-hidden="true"><rect x="4" y="4" width="28" height="28" rx="4" transform="rotate(45 18 18)" fill="var(--accent)"/><path d="M10 23l5-7 3 4 2-3 6 6z" fill="var(--accent-ink)"/></svg>
          <div class="grow">
            <h1>Ausflugskarte</h1>
            <p class="sub" id="sub">Ausflüge in der Schweiz</p>
          </div>
          <div class="ring" id="ring" title="Schon gemacht">
            <svg viewBox="0 0 44 44" aria-hidden="true"><circle class="bg" cx="22" cy="22" r="19"/><circle class="fg" id="ring-fg" cx="22" cy="22" r="19" stroke-dasharray="119.4" stroke-dashoffset="119.4"/></svg>
            <b id="ring-txt">0</b>
          </div>
          <button type="button" class="icon-btn" id="theme" aria-label="Farbschema wechseln"></button>
        </div>
        <div class="ask">
          <div class="ask-row">
            <span class="ask-label" id="l-zeit">Ich habe</span>
            <div class="seg" role="group" aria-labelledby="l-zeit" id="f-zeit">
              <button type="button" data-v="halb" aria-pressed="false">Halber Tag</button>
              <button type="button" data-v="ganz" aria-pressed="true">Ganzer Tag</button>
              <button type="button" data-v="wochenende" aria-pressed="false">Wochenende</button>
            </div>
          </div>
          <div class="ask-row">
            <span class="ask-label" id="l-tag">am</span>
            <div class="seg" role="group" aria-labelledby="l-tag" id="f-tag"></div>
          </div>
        </div>
      </header>

      <div class="tipp pad" id="tipp"></div>

      <div class="pad">
        <div class="suche">
          <label class="sr" for="q">Ausflug suchen</label>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="q" placeholder="Ort oder Ausflug suchen" autocomplete="off" enterkeyhint="search">
          <kbd>/</kbd>
        </div>
        <details class="more" id="more">
          <summary>
            <span class="t"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Filter</span>
            <span class="sum" id="sum"></span>
            <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </summary>
          <div class="filters">
            <div class="row">
              <span class="label" id="l-start">Start</span>
              <div class="seg" role="group" aria-labelledby="l-start" id="f-start">
                <button type="button" data-v="geroldswil" aria-pressed="true">Geroldswil</button>
                <button type="button" data-v="portein" aria-pressed="false">Portein</button>
                <button type="button" data-v="hier" aria-pressed="false">Mein Standort</button>
              </div>
            </div>
            <div class="row">
              <span class="label" id="l-mode">Unterwegs mit</span>
              <div class="seg" role="group" aria-labelledby="l-mode" id="f-mode">
                <button type="button" data-v="auto" aria-pressed="true">Auto</button>
                <button type="button" data-v="oev" aria-pressed="false">ÖV</button>
              </div>
            </div>
            <div class="row">
              <label class="label" for="f-max">Anreise höchstens</label>
              <div class="range">
                <input type="range" id="f-max" min="30" max="300" step="15" value="180">
                <output id="o-max" for="f-max">3 h</output>
              </div>
            </div>
            <div class="row">
              <span class="label" id="l-kat">Was</span>
              <div class="chips" role="group" aria-labelledby="l-kat" id="f-kat"></div>
            </div>
            <div class="row">
              <span class="label" id="l-zeigen">Zeigen</span>
              <div class="seg" role="group" aria-labelledby="l-zeigen" id="f-zeigen">
                <button type="button" data-v="alle" aria-pressed="true">Alle</button>
                <button type="button" data-v="merk" aria-pressed="false">Merkliste</button>
                <button type="button" data-v="neu" aria-pressed="false">Noch nicht gemacht</button>
              </div>
            </div>
            <label class="switch"><span>Wetter passt<small>trocken, oder geht auch bei Regen</small></span><input type="checkbox" id="f-wetter" checked></label>
            <label class="switch"><span id="t-saison">Passt zur Jahreszeit</span><input type="checkbox" id="f-saison" checked></label>
          </div>
        </details>
      </div>

      <div class="list-head pad">
        <span class="count" id="count" aria-live="polite">Lade …</span>
        <button type="button" class="btn gelb" id="surprise" title="Taste Z">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg>
          Überrasch mich
        </button>
      </div>
      <div class="pad" id="notice"></div>
      <ul class="list" id="list"></ul>
    </section>

    <!-- Detail -->
    <section class="view" id="view-detail" hidden aria-live="polite"></section>
  </div>
</aside>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/supercluster@8.0.1/dist/supercluster.min.js"></script>
<script src="aktivitaeten.js?v=14"></script>
<script src="anreise.js?v=14"></script>
<script src="app.js?v=14"></script>
</body>
</html>
